name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  server:
    name: server (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
        working-directory: server
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --component clippy,rustfmt && rustup default stable
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install TypeScript 7
        run: |
          npm install --prefix "$RUNNER_TEMP/ts" typescript@7.0.2
          platform=$(node -p "process.platform + '-' + process.arch")
          exe=tsc
          if [ "$RUNNER_OS" = Windows ]; then exe=tsc.exe; fi
          echo "TSGO_WATCH_TEST_TSC=$RUNNER_TEMP/ts/node_modules/@typescript/typescript-$platform/lib/$exe" >> "$GITHUB_ENV"
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked

  extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --component clippy --target wasm32-wasip2 && rustup default stable
      - run: cargo clippy --locked --target wasm32-wasip2 -- -D warnings
      - run: cargo test --locked
      - run: cargo build --locked --release --target wasm32-wasip2
