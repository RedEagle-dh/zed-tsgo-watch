name: Release

on:
  push:
    tags: ["v*"]
  # Prove the cross builds on pull requests that change this workflow; nothing is published.
  pull_request:
    paths: [.github/workflows/release.yml]

permissions:
  contents: read

jobs:
  build:
    name: build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-musl, os: ubuntu-latest }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-latest }
          - { target: x86_64-apple-darwin, os: macos-latest }
          - { target: aarch64-apple-darwin, os: macos-latest }
          - { target: x86_64-pc-windows-msvc, os: windows-latest }
          - { target: aarch64-pc-windows-msvc, os: windows-latest }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      # Static musl binaries link with the bundled lld; no cross C toolchain is needed.
      CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: rust-lld
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --target ${{ matrix.target }} && rustup default stable
      - name: Build
        working-directory: server
        run: cargo build --locked --release --target ${{ matrix.target }}
      - name: Package
        run: |
          exe=tsgo-watch-lsp
          case "${{ matrix.target }}" in *windows*) exe=tsgo-watch-lsp.exe ;; esac
          mkdir -p dist
          gzip -9 -c "server/target/${{ matrix.target }}/release/$exe" > "dist/tsgo-watch-lsp-${{ matrix.target }}.gz"
      - uses: actions/upload-artifact@v7
        with:
          name: tsgo-watch-lsp-${{ matrix.target }}
          path: dist/tsgo-watch-lsp-${{ matrix.target }}.gz
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.gz --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
