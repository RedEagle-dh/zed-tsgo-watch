[package]
name = "tsgo-watch-lsp"
version = "0.1.0"
edition = "2024"
description = "Language server that reports TypeScript 7 diagnostics for every file of a workspace"
license = "MIT"
repository = "https://github.com/RedEagle-dh/zed-tsgo-watch"
publish = false

# Keeps this package out of the extension crate in the repository root.
[workspace]

[[bin]]
name = "tsgo-watch-lsp"
path = "src/main.rs"

[dependencies]
crossbeam-channel = "0.5"
ignore = "0.4"
lsp-server = "0.10"
lsp-types = "0.97"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true
